<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'OswaldX';src:url('oswald.ttf');font-weight:200 700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0c0c0f;font-family:'OswaldX',sans-serif;color:#fff}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(900px 800px at 50% 40%,rgba(255,200,40,.14),transparent 70%),linear-gradient(180deg,#0c0c0f,#120d0a 60%,#0c0c0f)}
.haz{position:absolute;left:0;right:0;height:60px;background:repeating-linear-gradient(45deg,#ffd23f 0 34px,#111 34px 68px)}
.hl{position:absolute;left:0;right:0;top:185px;text-align:center;font-size:222px;font-weight:700;line-height:1;color:#ffd23f;-webkit-text-stroke:10px #000;paint-order:stroke fill;text-shadow:0 10px 0 #000,0 0 50px rgba(255,210,63,.45);letter-spacing:-2px;white-space:nowrap}
.sub{position:absolute;left:60px;right:60px;top:440px;text-align:center;background:#e01f1f;border-radius:10px;font-size:62px;font-weight:700;padding:4px 10px 12px;z-index:5;white-space:nowrap;box-shadow:0 10px 26px rgba(0,0,0,.7);letter-spacing:2px;transform:rotate(-1.5deg)}
.ph{position:absolute;left:0;top:560px;width:1080px;height:1130px;background:url(presenter_close.jpg) center/cover;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 88%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 88%,transparent 100%)}
.tri{position:absolute;width:260px;height:230px;background:#ffd23f;clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 12px 18px rgba(0,0,0,.8))}
.tri i{position:absolute;left:0;right:0;bottom:0;top:0;background:#e01f1f;clip-path:polygon(50% 12%,92% 92%,8% 92%);display:flex;align-items:flex-end;justify-content:center}
.tri b{font-size:132px;line-height:1;color:#fff;margin-bottom:6px}
</style></head><body><div id="c">
<div class="haz" style="top:110px"></div>
<div class="hl">3 MISTAKES</div>
<div class="sub">COST WATCH BUYERS THOUSANDS</div>
<div class="ph"></div>
<div class="tri" style="left:90px;top:1390px"><i><b>1</b></i></div>
<div class="tri" style="left:410px;top:1430px"><i><b>2</b></i></div>
<div class="tri" style="left:730px;top:1390px"><i><b>3</b></i></div>
<div class="haz" style="top:1730px"></div>
</div></body></html>
