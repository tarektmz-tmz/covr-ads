<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'OswaldX';src:url('assets/oswald.ttf');font-weight:200 700}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1920px;background:#000;overflow:hidden}
#st{position:absolute;inset:0;overflow:hidden;font-family:'Inter',sans-serif;color:#fff;background:#000}
#v{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:50% 0}
#gtop{position:absolute;left:0;top:0;width:1080px;height:820px;background:linear-gradient(180deg,rgba(4,8,14,.80) 0%,rgba(4,8,14,.5) 50%,rgba(4,8,14,0) 100%)}
#gbot{position:absolute;left:0;bottom:0;width:1080px;height:700px;background:linear-gradient(0deg,rgba(4,8,14,.78) 0%,rgba(4,8,14,0) 100%)}
#warm{position:absolute;left:0;top:300px;width:1080px;height:520px;background:radial-gradient(ellipse at 50% 55%,rgba(220,165,70,.30),rgba(220,165,70,0) 62%)}
#logo{position:absolute;left:50%;top:46px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:9px 28px 9px 14px;border-radius:60px;background:rgba(8,16,26,.62);border:1px solid rgba(230,194,122,.55);backdrop-filter:blur(10px)}
#logo img{width:44px;height:44px}#logo span{font-family:'OswaldX';font-weight:500;letter-spacing:5px;font-size:27px;color:#e6c27a}
#prog{position:absolute;left:0;top:0;height:7px;width:0;background:linear-gradient(90deg,#f6dc9b,#c9953f);box-shadow:0 0 18px rgba(246,201,87,.8)}
.sc{position:absolute;inset:0;opacity:0}
.kick{position:absolute;left:54px;top:108px;font-family:'OswaldX';font-weight:500;font-size:28px;letter-spacing:11px;color:#e6c27a}
.ttl{position:absolute;left:50px;top:138px;font-family:'OswaldX';font-weight:700;line-height:1;letter-spacing:1px;text-shadow:0 6px 30px rgba(0,0,0,.7);white-space:nowrap}
.ttl span{display:inline-block}
.sub{position:absolute;left:56px;top:318px;font-family:'OswaldX';font-weight:500;font-size:30px;letter-spacing:6px;color:#fff;opacity:0}
.ul{position:absolute;left:56px;top:306px;height:6px;background:linear-gradient(90deg,#f6dc9b,#c9953f);width:0}
.num{position:absolute;right:54px;top:112px;font-family:'OswaldX';font-weight:600;font-size:34px;letter-spacing:4px;color:#e6c27a}
.w{position:absolute;opacity:0;perspective:900px}.w img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 22px 22px rgba(0,0,0,.65));}
.w .ring{position:absolute;left:50%;top:50%;width:150%;height:100%;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(255,230,170,.42),rgba(255,230,170,0) 66%);opacity:.5}
.lb{position:absolute;text-align:center;opacity:0;font-family:'OswaldX';letter-spacing:3px;white-space:nowrap}.lb .a{font-size:33px;font-weight:600}.lb .b{font-size:22px;color:#e6c27a;margin-top:1px}
#leak{position:absolute;top:-200px;width:620px;height:2400px;background:linear-gradient(90deg,rgba(255,200,120,0),rgba(255,190,100,.6),rgba(255,120,60,.28),rgba(255,200,120,0));mix-blend-mode:screen;transform:rotate(18deg);opacity:0;filter:blur(26px)}
#cap{position:absolute;left:0;right:0;top:1500px;text-align:center;opacity:0;white-space:nowrap}
#cap span{display:inline-block;margin:0 9px;font-family:'OswaldX';font-weight:700;font-size:74px;text-transform:uppercase;color:#fff;-webkit-text-stroke:1.5px rgba(0,0,0,.92);text-shadow:0 6px 26px rgba(0,0,0,.85);transition:none}
#cap span.on{color:#f6c957;transform:scale(1.1)}
#foot{position:absolute;left:0;right:0;top:1850px;text-align:center;font-family:'OswaldX';font-size:28px;letter-spacing:8px;color:rgba(230,194,122,.92);text-shadow:0 2px 10px rgba(0,0,0,.8)}
#endc{position:absolute;inset:0;opacity:0;background:rgba(4,8,14,.78)}
#endc .box{position:absolute;left:60px;top:560px;width:960px;height:760px;border-radius:50px;background:rgba(10,18,28,.55);border:1px solid rgba(230,194,122,.55);backdrop-filter:blur(14px);text-align:center}
#endc img{position:absolute;left:50%;top:70px;width:150px;height:150px;transform:translateX(-50%)}
#endc .h{position:absolute;left:0;right:0;top:250px;font-family:'OswaldX';font-weight:700;font-size:86px;letter-spacing:2px}
#endc .i{position:absolute;left:0;right:0;top:370px;font-size:48px;font-weight:600;color:#fff}
#endc .t{position:absolute;left:0;right:0;top:450px;font-size:33px;color:#d6dce6}
#endc .p{position:absolute;left:130px;right:130px;top:560px;height:104px;border-radius:52px;background:#25d366;font-family:'OswaldX';font-weight:600;font-size:46px;line-height:104px;color:#fff}
.gold{background:linear-gradient(180deg,#f6dc9b,#c9953f 60%,#8a6320);-webkit-background-clip:text;background-clip:text;color:transparent}
</style></head><body><div id="st">
<img id="v"><div id="gtop"></div><div id="warm"></div><div id="gbot"></div>
<div id="scs"></div><div id="leak"></div>
<div id="logo"><img src="assets/logo.png"><span>ADVANCE WATCH CO</span></div><div id="prog"></div>
<div id="cap"></div><div id="foot">@ADVANCE_WATCHCO</div>
<div id="endc"><div class="box"><img src="assets/logo.png"><div class="h gold">ADVANCE WATCH CO</div><div class="i">@advance_watchco</div><div class="t">Rolex guides and watches in Dubai</div><div class="p">WhatsApp link in our bio</div></div></div>
</div>
<script src="data2.js"></script><script>
const W=1080,H=1920,FPS=25,NF=504,VID=D.total,HOLD=2.6,TOT=VID+HOLD;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-clamp(x),3),eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eob=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const words=D.words;
function wt(txt,from=0){for(const w of words){if(w[1]>=from&&w[0].toLowerCase().includes(txt))return w[1];}return null}
const tSecond=wt('second'), tIfSub=words.filter(w=>w[0]=='If')[1][1];
const tWhite=wt('white',3), tBlack=wt('black',3), tPepsi=wt('pepsi'), tBruce=wt('wayne')-0.25, tBat=wt('batgirl')-0.55;
const SC=[
 {s:0,e:tSecond-0.1,kick:'ROLEX · TOP PICK',n:'DAYTONA',fs:122,sub:'STEEL · WHITE OR BLACK DIAL',num:'01 / 03',
  w:[['dayw','WHITE DIAL','126500LN',tWhite],['dayb','BLACK DIAL','126500LN',tBlack]]},
 {s:tSecond-0.1,e:tIfSub-0.05,kick:'ROLEX · TOP PICK',n:'GMT-MASTER II',fs:100,sub:'FULL STEEL · JUBILEE BRACELET',num:'02 / 03',
  w:[['pepsi','PEPSI','126710BLRO',tPepsi-0.2],['bruce','BRUCE WAYNE','126710GRNR',tBruce],['batgirl','BATGIRL','126710BLNR',tBat]]},
 {s:tIfSub-0.05,e:VID+0.05,kick:'ROLEX · TOP PICK',n:'SUBMARINER',fs:112,sub:'FULL STEEL',num:'03 / 03',
  w:[['subnd','NO-DATE BLACK','124060',null],['subd','DATE BLACK','126610LN',null],['subg','GREEN BEZEL','126610LV',null]]}
];
let chunks=[];(function(){let cur=[];words.forEach((w,i)=>{cur.push(w);const gap=i+1<words.length?words[i+1][1]-w[2]:9;
 if(cur.length>=3||/[.,?!]$/.test(w[0])||gap>0.4){chunks.push(cur);cur=[]}});if(cur.length)chunks.push(cur)})();
window.setup=async()=>{const c=document.getElementById('scs');
 SC.forEach((S,si)=>{const d=document.createElement('div');d.className='sc';d.id='sc'+si;
  d.innerHTML=`<div class="kick">${S.kick}</div><div class="num">${S.num}</div><div class="ttl" id="t${si}" style="font-size:${S.fs}px">${[...S.n].map(ch=>`<span>${ch==' '?'&nbsp;':ch}</span>`).join('')}</div><div class="ul" id="u${si}" style="top:${138+S.fs+6}px"></div>`;
  c.appendChild(d);
  const n=S.w.length;const wh=n==2?410:392, ww=wh*0.56, gap=n==2?130:44, tot=n*ww+(n-1)*gap, x0=(W-tot)/2, y=n==2?274:282;
  S.pos=[];S.w.forEach((it,i)=>{const x=x0+i*(ww+gap);const el=document.createElement('div');el.className='w';el.id=`w${si}_${i}`;
   el.style.cssText=`left:${x}px;top:${y}px;width:${ww}px;height:${wh}px`;el.innerHTML=`<div class="ring"></div><img src="assets/${it[0]}.png">`;d.appendChild(el);
   const lb=document.createElement('div');lb.className='lb';lb.id=`l${si}_${i}`;lb.style.cssText=`left:${x-50}px;top:${y+wh+6}px;width:${ww+100}px`;lb.innerHTML=`<div class="a">${it[1]}</div><div class="b">REF. ${it[2]}</div>`;d.appendChild(lb)});
 });};
function segIdx(t){let k=0;for(let i=0;i<D.bounds.length;i++)if(t>=D.bounds[i])k=i;return k}
window.setTime=async t=>{
 const v=document.getElementById('v');const idx=Math.min(NF,Math.floor(Math.min(t,VID-0.02)*FPS)+1);
 v.src='vf/f_'+String(idx).padStart(4,'0')+'.jpg';await v.decode();
 v.style.transform=`scale(${1.14+0.03*clamp(t/VID)})`;
 document.getElementById('prog').style.width=(clamp(t/TOT)*1080)+'px';
 const talking=t<VID;
 // scenes
 SC.forEach((S,si)=>{const el=document.getElementById('sc'+si);const vis=talking&&t>=S.s&&t<S.e;el.style.opacity=vis?1:0;if(!vis)return;const lt=t-S.s,dur=S.e-S.s;
  [...document.getElementById('t'+si).children].forEach((sp,i)=>{const a=eob((lt-0.04-i*0.035)/0.5);sp.style.transform=`translateY(${(1-a)*80}px) scale(${.7+.3*a})`;sp.style.opacity=clamp(a*1.5)});
  document.getElementById('u'+si).style.width=(eo((lt-0.35)/0.7)*620)+'px';
  const out=clamp((S.e-t)/0.25);
  S.w.forEach((it,i)=>{const we=document.getElementById(`w${si}_${i}`),lb=document.getElementById(`l${si}_${i}`),rg=we.querySelector('.ring');
   const a=eob((lt-0.22-i*0.2)/0.65);let act=0;
   if(it[3]!=null){const nx=S.w[i+1]&&S.w[i+1][3]!=null?S.w[i+1][3]:S.e;act=clamp((t-it[3]+0.05)/0.2)*(1-clamp((t-nx+0.05)/0.25))}
   else{const seg=dur/S.w.length;const c=Math.floor(lt/seg);act=(i==c&&lt>0.9)?1:0}
   const sc=(.86+.14*a)*(1+0.10*act)*(1+Math.sin(t*1.6+i)*0.01);
   we.style.opacity=clamp(a*1.6)*(0.62+0.38*Math.max(act,S.w.every(x=>x[3]==null)?0:0))*out+(0);
   we.style.opacity=clamp(a*1.6)*out*(it[3]!=null?(0.9+0.1*act):1);
   we.style.transform=`translateY(${(1-a)*150+Math.sin(t*1.7+i*1.1)*7}px) scale(${sc}) rotateY(${Math.sin(t*0.8+i)*6}deg)`;
   we.style.filter=`blur(${(1-a)*10}px)`;rg.style.opacity=0.5+0.5*act;
   const b=eo((lt-0.6-i*0.2)/0.45);lb.style.opacity=b*out;lb.style.transform=`translateY(${(1-b)*14}px) scale(${1+0.06*act})`;lb.querySelector('.a').style.color=act>0.5?'#f6c957':'#fff'});
 });
 // light leak at scene boundaries
 const lk=document.getElementById('leak');let o=0,x=-800;[SC[1].s,SC[2].s,VID].forEach(bd=>{const q=(t-(bd-0.3))/0.8;if(q>0&&q<1){o=Math.sin(q*Math.PI);x=lerp(-700,1500,eio(q))}});lk.style.opacity=o*0.9;lk.style.left=x+'px';
 // captions
 const cap=document.getElementById('cap');let ci=-1;
 if(talking){for(let i=0;i<chunks.length;i++){const c=chunks[i];const st=c[0][1]-0.04;const nx=i+1<chunks.length?chunks[i+1][0][1]-0.03:99;const en=Math.min(c[c.length-1][2]+0.18,nx);if(t>=st&&t<en){ci=i;break}}}
 if(ci<0)cap.style.opacity=0;else{const c=chunks[ci];if(cap.dataset.ci!=ci){cap.dataset.ci=ci;cap.innerHTML=c.map((w,j)=>`<span id="cw${j}">${w[0].replace(/[.,?!]/g,'')}</span>`).join('')}
  c.forEach((w,j)=>{const s=document.getElementById('cw'+j);if(s)s.className=(t>=w[1]-0.02&&t<w[2]+0.08)?'on':''});cap.style.opacity=1}
 document.getElementById('foot').style.opacity=talking?1:0;
 // end card
 const ec=document.getElementById('endc');const ea=eo((t-VID-0.15)/0.5);ec.style.opacity=t>=VID?ea:0;
 const bx=ec.querySelector('.box');bx.style.transform=`translateY(${(1-ea)*50}px) scale(${.94+.06*ea})`;
 return true};
</script></body></html>
