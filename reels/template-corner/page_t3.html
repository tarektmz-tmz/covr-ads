<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'OswaldX';src:url('oswald.ttf');font-weight:200 700}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#st{position:absolute;inset:0;overflow:hidden;font-family:'OswaldX',sans-serif;color:#fff}
#bg{position:absolute;inset:0;background:url(bg.jpg) center/cover}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,14,.55) 0%,rgba(5,8,14,.15) 45%,rgba(5,8,14,.55) 100%)}
#hook{position:absolute;left:60px;right:60px;top:300px;text-align:center;opacity:0}
#hook .k{font-weight:500;letter-spacing:9px;font-size:26px;color:#e6c27a}
#hook .t{font-weight:700;font-size:92px;line-height:1.02;margin-top:6px;text-shadow:0 6px 30px rgba(0,0,0,.8)}
#hook .ul{height:5px;width:0;margin:14px auto 0;background:linear-gradient(90deg,#f6dc9b,#c9953f)}
.card{position:absolute;left:90px;width:900px;top:520px;height:730px;border-radius:40px;background:rgba(8,14,24,.58);border:1.5px solid rgba(230,194,122,.6);backdrop-filter:blur(8px);opacity:0}
.card img{position:absolute;left:50%;top:26px;height:470px;transform:translateX(-50%);filter:drop-shadow(0 22px 22px rgba(0,0,0,.65))}
.card .n{position:absolute;left:0;right:0;top:520px;text-align:center;font-weight:700;font-size:54px;letter-spacing:1px}
.card .r{position:absolute;left:0;right:0;top:588px;text-align:center;font-weight:400;font-size:28px;letter-spacing:4px;color:#e6c27a}
.card .p{position:absolute;left:0;right:0;top:632px;text-align:center;font-weight:700;font-size:70px;color:#fff}
.gbox{position:absolute;left:50px;width:980px;top:500px;height:730px;border-radius:40px;background:rgba(8,14,24,.62);border:1.5px solid rgba(230,194,122,.6);backdrop-filter:blur(8px);opacity:0}
.gt1{position:absolute;left:0;right:0;top:34px;text-align:center;font-weight:700;font-size:58px;letter-spacing:1px}
.gs1{position:absolute;left:0;right:0;top:106px;text-align:center;font-weight:500;font-size:24px;letter-spacing:5px;color:#e6c27a}
.it{position:absolute;top:158px;text-align:center;opacity:0}
.it img{height:360px;filter:drop-shadow(0 18px 18px rgba(0,0,0,.65))}
.it .a{font-weight:700;font-size:28px;line-height:1.05;margin-top:12px}
.it .b{font-weight:400;font-size:19px;letter-spacing:3px;color:#e6c27a;margin-top:6px}
.it .c{font-weight:700;font-size:40px;margin-top:8px}
.it .rg{position:absolute;inset:-10px;border-radius:26px;border:3px solid #f6c957;box-shadow:0 0 30px rgba(246,201,87,.7);opacity:0}
#lose{position:absolute;left:50px;width:980px;top:520px;height:330px;border-radius:40px;background:rgba(8,14,24,.62);border:1.5px solid rgba(255,106,92,.7);opacity:0;text-align:center}
#lose div:first-child{margin-top:92px;font-weight:700;font-size:78px;color:#ff6a5c;line-height:1.05}
#lose div:last-child{margin-top:16px;font-weight:500;font-size:36px;letter-spacing:4px;color:#ffb3aa}
.ring{position:absolute;inset:-6px;border-radius:44px;border:3px solid #f6c957;box-shadow:0 0 36px rgba(246,201,87,.7);opacity:0}
#teaser{position:absolute;left:0;right:0;top:600px;text-align:center;font-weight:600;font-size:30px;letter-spacing:6px;color:#f6c957;opacity:0}
#dots{position:absolute;left:0;right:0;top:470px;text-align:center;opacity:0}
#dots i{display:inline-block;width:18px;height:18px;border-radius:50%;margin:0 9px;border:2px solid #e6c27a}
#dots i.on{background:#f6c957;box-shadow:0 0 16px rgba(246,201,87,.8)}
#cta{position:absolute;left:60px;right:60px;top:560px;text-align:center;font-weight:700;font-size:62px;line-height:1.1;color:#fff;background:rgba(8,14,24,.7);border:2px solid #f6c957;border-radius:34px;padding:34px 20px;opacity:0;box-shadow:0 0 40px rgba(246,201,87,.45)}
#cap{position:absolute;left:40px;right:40px;top:1290px;text-align:center;opacity:0;white-space:nowrap}
#cap span{display:inline-block;margin:0 9px;font-weight:700;font-size:64px;text-transform:uppercase;color:#fff;-webkit-text-stroke:1.5px rgba(0,0,0,.9);text-shadow:0 5px 22px rgba(0,0,0,.85)}
#cap span.on{color:#f6c957}
#me{position:absolute;right:0;bottom:0;width:460px;height:541px;background-size:cover;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 46px),linear-gradient(to bottom,transparent 0,#000 46px);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 46px),linear-gradient(to bottom,transparent 0,#000 46px);mask-composite:intersect}
</style></head><body><div id="st"><div id="bg"></div><div id="shade"></div>
<div id="hook"><div class="k">FORMER ROLEX EMPLOYEE</div><div class="t" id="ht"></div><div class="ul" id="hu"></div></div>
<div id="teaser">THE LAST ONE SURPRISES MOST PEOPLE</div><div id="dots"></div><div id="cards"></div><div id="lose"><div>OTHER DIALS</div><div>LOSE VALUE OVER TIME</div></div><div id="cta">DM ME FOR PRICE &amp; AVAILABILITY</div><div id="cap"></div><canvas id="me" width="460" height="541"></canvas>
</div>
<script src="cfg_t2.js"></script><script>
const FPS=C.fps,NF=C.nf,VID=C.dur;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const eob=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const words=C.words;let chunks=[];(function(){let cur=[];words.forEach((w,i)=>{cur.push(w);const gap=i+1<words.length?words[i+1][1]-w[2]:9;if(cur.length>=3||/[.,?!]$/.test(w[0])||gap>0.4){chunks.push(cur);cur=[]}});if(cur.length)chunks.push(cur)})();
const meCv=document.getElementById('me'),mx=meCv.getContext('2d');
window.setup=async()=>{document.getElementById('ht').innerHTML=C.hook;document.getElementById('dots').innerHTML=Array.from({length:C.groups.length},()=>'<i></i>').join('');
 const c=document.getElementById('cards');C.groups.forEach((g,gi)=>{const d=document.createElement('div');d.className='gbox';d.id='gb'+gi;const n=g.items.length,slot=(980-60)/n;
  let h=`<div class="gt1">${g.t}</div><div class="gs1">${g.sub}</div>`;
  g.items.forEach((it,i)=>{const w=Math.min(slot,300);const x=30+i*slot+(slot-w)/2;h+=`<div class="it" id="it${gi}_${i}" style="left:${x}px;width:${w}px"><div class="rg" id="rg${gi}_${i}"></div><img src="${it.img}.png" style="max-width:${w-10}px;height:${n>3?330:360}px;object-fit:contain"><div class="a" style="font-size:${n>3?25:28}px">${it.name}</div><div class="b">REF. ${it.ref}</div><div class="c" style="font-size:${n>3?36:40}px">${it.p}</div></div>`});
  d.innerHTML=h;c.appendChild(d)})};
window.setTime=async t=>{
 const idx=Math.min(NF,Math.floor(Math.min(t,VID-0.02)*FPS)+1);
 const im=new Image();im.src=C.vf+String(idx).padStart(4,'0')+'.jpg';await im.decode();
 mx.clearRect(0,0,460,541);const sc=460/C.cw;mx.drawImage(im,C.cx,C.cy,C.cw,C.ch,0,0,460,541);
 const h=document.getElementById('hook');const ha=eo(t/0.5),ho=1-clamp((t-C.hookEnd)/0.3);h.style.opacity=ha*ho;h.style.transform=`translateY(${(1-ha)*-30}px)`;document.getElementById('hu').style.width=(eo((t-0.3)/0.6)*520)+'px';
 C.groups.forEach((g,gi)=>{const d=document.getElementById('gb'+gi);const lt=t-g.s;const vis=t>=g.s&&t<g.e;if(!vis){d.style.opacity=0;return}
  const a=eob(lt/0.5),out=1-clamp((t-(g.e-0.25))/0.25);d.style.opacity=clamp(a*1.5)*out;d.style.transform=`translateY(${(1-a)*120}px) scale(${.92+.08*a})`;
  g.items.forEach((it,i)=>{const e=document.getElementById(`it${gi}_${i}`);const ia=eob((t-it.at)/0.45),ba=eob((t-g.s-0.15-i*0.12)/0.5);e.style.opacity=0.32+0.68*clamp(ia*1.6)*(t>=it.at?1:0);if(t<it.at)e.style.opacity=0.32*clamp(ba*1.6);e.style.transform=`translateY(${(1-ba)*50}px) scale(${.9+.1*ba+(t>=it.at?.03*ia:0)})`;
   const nx=g.items[i+1]?g.items[i+1].at:g.e;const act=(t>=it.at&&t<nx)?1:0;document.getElementById(`rg${gi}_${i}`).style.opacity=act*clamp((t-it.at-0.15)/0.2)})});
 const lo=document.getElementById('lose');const la=eob((t-C.lose[0])/0.5),lout=1-clamp((t-(C.lose[1]-0.2))/0.2);lo.style.opacity=(t>=C.lose[0]&&t<C.lose[1])?clamp(la*1.5)*lout:0;lo.style.transform=`translateY(${(1-la)*100}px)`;
 const te=document.getElementById('teaser');te.style.opacity=clamp((t-0.6)/0.4)*(1-clamp((t-C.hookEnd)/0.3));const dt=document.getElementById('dots');dt.style.opacity=clamp((t-C.hookEnd)/0.4);let act=-1;C.groups.forEach((g,gi)=>{if(t>=g.s)act=gi});[...dt.children].forEach((d,i)=>d.className=(t>=C.hookEnd&&i<=act)?'on':'');
 const cta=document.getElementById('cta');const ca=eo((t-C.cta)/0.5);cta.style.opacity=ca;cta.style.transform=`scale(${.92+.08*ca})`;
 const cap=document.getElementById('cap');let ci=-1;for(let i=0;i<chunks.length;i++){const c=chunks[i];const st=c[0][1]-0.04;const nx=i+1<chunks.length?chunks[i+1][0][1]-0.03:99;const en=Math.min(c[c.length-1][2]+0.2,nx);if(t>=st&&t<en){ci=i;break}}
 if(ci<0)cap.style.opacity=0;else{const c=chunks[ci];if(cap.dataset.ci!=ci){cap.dataset.ci=ci;cap.innerHTML=c.map((w,j)=>`<span id="cw${j}">${w[0].replace(/[.,?!]/g,'')}</span>`).join(' ')}c.forEach((w,j)=>{const s=document.getElementById('cw'+j);if(s)s.className=(t>=w[1]-0.02&&t<w[2]+0.08)?'on':''});cap.style.opacity=1}
 return true};
</script></body></html>
